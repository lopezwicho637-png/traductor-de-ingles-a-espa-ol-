<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traductor EN ⇄ ES · 50 palabras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B1F3B;
    --ink-soft:#3A3F63;
    --gold:#F2A65A;
    --teal:#2EC4B6;
    --card:#FBF7F0;
    --line:#E4DFD4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--ink);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(46,196,182,0.18), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(242,166,90,0.18), transparent 40%);
    font-family:'Inter', sans-serif;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:32px 16px 60px;
  }
  header{
    text-align:center;
    margin-bottom:28px;
  }
  .eyebrow{
    color:var(--teal);
    font-weight:600;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-size:12px;
    margin-bottom:6px;
  }
  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(28px,5vw,44px);
    color:#fff;
    margin:0;
  }
  h1 span{color:var(--gold);}
  .sub{color:#C8CBDD;font-size:14px;margin-top:8px;}

  .switch-row{
    display:flex;
    background:rgba(255,255,255,0.08);
    border-radius:999px;
    padding:4px;
    margin-bottom:22px;
  }
  .switch-row button{
    border:none;
    background:transparent;
    color:#C8CBDD;
    font-family:'Inter';
    font-weight:600;
    font-size:14px;
    padding:10px 22px;
    border-radius:999px;
    cursor:pointer;
    transition:.2s;
  }
  .switch-row button.active{
    background:var(--gold);
    color:var(--ink);
  }

  .card{
    background:var(--card);
    border-radius:24px;
    width:min(420px,92vw);
    padding:36px 28px 28px;
    text-align:center;
    box-shadow:0 24px 60px rgba(0,0,0,0.35);
    border:1px solid var(--line);
  }
  .emoji{
    font-size:96px;
    line-height:1;
    margin-bottom:14px;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,0.15));
  }
  .word-from{
    font-family:'Baloo 2';
    font-weight:700;
    font-size:26px;
    color:var(--ink-soft);
  }
  .arrow{color:var(--teal);font-weight:700;margin:0 8px;}
  .word-to{
    font-family:'Baloo 2';
    font-weight:800;
    font-size:26px;
    color:var(--ink);
  }
  .translation-line{margin-top:4px;margin-bottom:22px;}

  select{
    width:100%;
    padding:12px 14px;
    font-size:15px;
    font-family:'Inter';
    border-radius:12px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    margin-bottom:12px;
  }

  .nav-buttons{
    display:flex;
    gap:10px;
  }
  .nav-buttons button{
    flex:1;
    padding:12px;
    border-radius:12px;
    border:none;
    font-family:'Inter';
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    transition:.15s;
  }
  #prevBtn{background:transparent;border:1px solid var(--line);color:var(--ink-soft);}
  #nextBtn{background:var(--ink);color:#fff;}
  #prevBtn:hover{background:#f0ece3;}
  #nextBtn:hover{background:var(--ink-soft);}

  .grid-title{
    color:#C8CBDD;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.1em;
    margin:40px 0 14px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(96px,1fr));
    gap:10px;
    width:min(760px,94vw);
  }
  .tile{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:14px;
    padding:10px 6px;
    text-align:center;
    cursor:pointer;
    transition:.15s;
  }
  .tile:hover{background:rgba(242,166,90,0.18);}
  .tile .e{font-size:30px;display:block;margin-bottom:4px;}
  .tile .w{font-size:11px;color:#C8CBDD;font-family:'Inter';font-weight:500;}
  .tile.active{background:var(--gold);}
  .tile.active .w{color:var(--ink);}
</style>
</head>
<body>

<header>
  <div class="eyebrow">Flashcards bilingües</div>
  <h1>Traductor <span>EN ⇄ ES</span></h1>
  <div class="sub">50 palabras con imagen · aprende jugando</div>
</header>

<div class="switch-row">
  <button id="btnEnEs" class="active">Inglés → Español</button>
  <button id="btnEsEn">Español → Inglés</button>
</div>

<div class="card">
  <div class="emoji" id="emoji">🐱</div>
  <select id="selector"></select>
  <div class="translation-line">
    <span class="word-from" id="fromWord">cat</span>
    <span class="arrow">→</span>
    <span class="word-to" id="toWord">gato</span>
  </div>
  <div class="nav-buttons">
    <button id="prevBtn">◀ Anterior</button>
    <button id="nextBtn">Siguiente ▶</button>
  </div>
</div>

<div class="grid-title">Todas las palabras</div>
<div class="grid" id="grid"></div>

<script>
const palabras = [
  ["cat","gato","🐱"],["dog","perro","🐶"],["house","casa","🏠"],["water","agua","💧"],
  ["sun","sol","☀️"],["moon","luna","🌙"],["star","estrella","⭐"],["tree","árbol","🌳"],
  ["flower","flor","🌸"],["book","libro","📖"],["apple","manzana","🍎"],["banana","plátano","🍌"],
  ["car","carro","🚗"],["bicycle","bicicleta","🚲"],["train","tren","🚆"],["airplane","avión","✈️"],
  ["boat","barco","🚢"],["fish","pez","🐟"],["bird","pájaro","🐦"],["horse","caballo","🐴"],
  ["cow","vaca","🐄"],["pig","cerdo","🐷"],["chicken","pollo","🐔"],["egg","huevo","🥚"],
  ["milk","leche","🥛"],["bread","pan","🍞"],["cheese","queso","🧀"],["coffee","café","☕"],
  ["tea","té","🍵"],["pizza","pizza","🍕"],["cake","pastel","🎂"],["table","mesa","🪑"],
  ["chair","silla","💺"],["door","puerta","🚪"],["window","ventana","🪟"],["bed","cama","🛏️"],
  ["clock","reloj","🕐"],["phone","teléfono","📱"],["computer","computadora","💻"],["key","llave","🔑"],
  ["money","dinero","💰"],["heart","corazón","❤️"],["eye","ojo","👁️"],["hand","mano","✋"],
  ["foot","pie","🦶"],["hat","sombrero","🎩"],["shoe","zapato","👟"],["umbrella","paraguas","☂️"],
  ["rainbow","arcoíris","🌈"],["snow","nieve","❄️"]
];

let modoEnEs = true; // true = ingles->espanol
let indice = 0;

const emojiEl = document.getElementById('emoji');
const fromWordEl = document.getElementById('fromWord');
const toWordEl = document.getElementById('toWord');
const selector = document.getElementById('selector');
const grid = document.getElementById('grid');
const btnEnEs = document.getElementById('btnEnEs');
const btnEsEn = document.getElementById('btnEsEn');

function construirSelector(){
  selector.innerHTML = '';
  palabras.forEach((p, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = modoEnEs ? p[0] : p[1];
    selector.appendChild(opt);
  });
  selector.value = indice;
}

function construirGrid(){
  grid.innerHTML = '';
  palabras.forEach((p, i) => {
    const tile = document.createElement('div');
    tile.className = 'tile' + (i === indice ? ' active' : '');
    tile.innerHTML = `<span class="e">${p[2]}</span><span class="w">${modoEnEs ? p[0] : p[1]}</span>`;
    tile.onclick = () => { indice = i; render(); };
    grid.appendChild(tile);
  });
}

function render(){
  const p = palabras[indice];
  emojiEl.textContent = p[2];
  if(modoEnEs){
    fromWordEl.textContent = p[0];
    toWordEl.textContent = p[1];
  } else {
    fromWordEl.textContent = p[1];
    toWordEl.textContent = p[0];
  }
  selector.value = indice;
  construirGrid();
}

btnEnEs.onclick = () => { modoEnEs = true; btnEnEs.classList.add('active'); btnEsEn.classList.remove('active'); construirSelector(); render(); };
btnEsEn.onclick = () => { modoEnEs = false; btnEsEn.classList.add('active'); btnEnEs.classList.remove('active'); construirSelector(); render(); };

selector.onchange = () => { indice = parseInt(selector.value); render(); };
document.getElementById('prevBtn').onclick = () => { indice = (indice - 1 + palabras.length) % palabras.length; render(); };
document.getElementById('nextBtn').onclick = () => { indice = (indice + 1) % palabras.length; render(); };

construirSelector();
render();
</script>

</body>
</html>
